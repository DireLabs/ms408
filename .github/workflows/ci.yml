name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (core + dev)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests
      # Tests that need the acquired corpus (L19 consume-only) skip automatically; the
      # value-pinning test (test_shipped_bands_are_pinned) runs data-free and guards the
      # exact numbers the tool reports.
      - name: Test
        run: pytest -q
